name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports

  # Runs for tags such as v1.0.0. Builds the signed APK and attaches it to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLIO_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      FOLIO_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
      FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
      FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FOLIO_KEYSTORE_BASE64 is missing. See README, section Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$FOLIO_KEYSTORE_FILE"
      - name: Build signed APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Android installs an update only when the version code is higher than the installed one.
          # The offset keeps releases above the codes of local test builds (below 1000).
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$((GITHUB_RUN_NUMBER + 1000))"
          mv app/build/outputs/apk/release/app-release.apk "folio-$VERSION.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: folio-*.apk
          generate_release_notes: true
